name: ncms

services:
  db:
    image: postgres:16-alpine
    container_name: ncms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncms_db}
      POSTGRES_USER: ${POSTGRES_USER:-ncms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  redis:
    image: redis:7-alpine
    container_name: ncms_redis
    restart: unless-stopped
    ports:
      - "6381:6379"

  backend:
    build:
      context: ./backend
    container_name: ncms_backend
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./frontend/src/assets/cot.svg:/ncms-assets/cot.svg:ro
    depends_on:
      - db
      - redis
    ports:
      - "8002:8000"

  frontend:
    build:
      context: ./frontend
    container_name: ncms_frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5175:5173"

  nginx:
    image: nginx:alpine
    container_name: ncms_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "1515:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  frontend_node_modules:
