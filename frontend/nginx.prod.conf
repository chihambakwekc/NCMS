server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The HTML shell must always be fetched again. A cached index.html can
    # reference a previous JavaScript release and leave users on an obsolete
    # version of the system after a deployment.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Vite gives release assets content hashes, so these may be cached without
    # risking an old application after a new deployment.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
